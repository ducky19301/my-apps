<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#110b1f"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="robots" content="noindex">
<title>My Apps</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
background:radial-gradient(circle at 15% 0%,#2a1850 0,#160d2a 38%,#110b1f 70%) fixed;padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 28px)}
body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.5;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 40% 80%,#fff,transparent),radial-gradient(1px 1px at 10% 70%,#fff,transparent)}
h1{font-size:30px;margin:0 0 4px;background:linear-gradient(90deg,#ff6bd6,#8b7bff,#ffb86b);-webkit-background-clip:text;color:transparent}
p.sub{margin:0 0 22px;color:rgba(255,255,255,.6)}
main{max-width:560px;margin:auto}
a.card{display:flex;gap:16px;align-items:center;padding:20px;margin-bottom:14px;border-radius:22px;color:inherit;text-decoration:none;
background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .15s}
a.card:active{transform:scale(.98)}
.ic{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#ff6bd6,#8b7bff)}
.t{font-size:19px;font-weight:650}.d{color:rgba(255,255,255,.65);font-size:14px;margin-top:3px;line-height:1.35}
a.card.hub{background:linear-gradient(135deg,rgba(163,92,255,.45),rgba(255,107,214,.35));border:1px solid rgba(255,184,107,.6);padding:24px}
a.card.hub .t{font-size:21px}
.u{color:#ffb86b;font-size:12px;margin-top:6px;word-break:break-all}
</style></head><body><main><h1>My Apps</h1><p class="sub">Tap an app to open it. Private apps and files are inside the hub and need your passphrase.</p><div id="list"></div></main>
<script>
fetch('apps.json',{cache:'no-cache'}).then(r=>r.json()).then(apps=>{const L=document.getElementById('list');
apps.forEach(a=>{const c=document.createElement('a');c.className='card'+(a.hub?' hub':'');c.href=a.url;
c.innerHTML='<div class="ic"></div><div><div class="t"></div><div class="d"></div><div class="u"></div></div>';
c.querySelector('.ic').textContent=a.icon||'✦';c.querySelector('.t').textContent=a.name;c.querySelector('.d').textContent=a.description;c.querySelector('.u').textContent=a.url.replace(/^https?:\/\//,'');L.appendChild(c)})});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
